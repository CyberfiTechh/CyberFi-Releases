name: Verify packaged CyberFi macOS MCP preparation
run-name: Verify macOS MCP ${{ inputs.architecture }} asset ${{ inputs.asset_id }}

on:
    workflow_dispatch:
        inputs:
            target_version:
                type: choice
                options: ["0.0.115", "0.0.116", "0.0.117", "0.0.118", "0.0.119", "0.0.120", "0.0.121", "0.0.122", "0.0.128"]
                default: "0.0.115"
            architecture:
                type: choice
                options: [x64, arm64]
                required: true
            release_id:
                type: string
                required: true
            asset_id:
                type: string
                required: true
            sha256:
                type: string
                required: true
            accessory_container:
                type: boolean
                default: false
                description: Use a declared ad-hoc accessory test copy with identical ASAR, MCP sources and fuse states

permissions:
    contents: read

jobs:
    mcp:
        if: github.repository == 'CyberfiTechh/CyberFi-Releases' && github.event.repository.private == false && github.ref == 'refs/heads/main'
        permissions:
            contents: write
        runs-on: ${{ inputs.architecture == 'arm64' && 'macos-15' || 'macos-15-intel' }}
        timeout-minutes: 50
        env:
            ARCH: ${{ inputs.architecture }}
            TARGET_VERSION: ${{ inputs.target_version || '0.0.115' }}
            RELEASE_ID: ${{ inputs.release_id }}
            ASSET_ID: ${{ inputs.asset_id }}
            EXPECTED_SHA: ${{ inputs.sha256 }}
            DERIVED_ACCESSORY_CONTAINER: ${{ inputs.accessory_container }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  path: acceptance
                  persist-credentials: false
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  repository: slopus/happy-desktop
                  ref: c9feffb54cdb3591220dafced4070e118e3d297a
                  path: upstream
                  persist-credentials: false
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
              with:
                  package_json_file: upstream/package.json
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
              with:
                  node-version: "24"
                  package-manager-cache: false
            - name: Install public hidden launcher
              working-directory: upstream
              run: pnpm install --frozen-lockfile --ignore-scripts
            - name: Download and verify the exact published target candidate
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  [[ "$RELEASE_ID" =~ ^[0-9]+$ && "$ASSET_ID" =~ ^[0-9]+$ && "$EXPECTED_SHA" =~ ^[0-9a-f]{64}$ ]]
                  case "$TARGET_VERSION" in 0.0.115|0.0.116|0.0.117|0.0.118|0.0.119|0.0.120|0.0.121|0.0.122|0.0.128) ;; *) exit 1 ;; esac
                  case "$ARCH" in arm64) native=arm64 ;; x64) native=x86_64 ;; *) exit 1 ;; esac
                  test "$(uname -m)" = "$native"
                  filename="CyberFi-$TARGET_VERSION-$ARCH.dmg"
                  if [ "$TARGET_VERSION" = 0.0.128 ]; then
                    test "$DERIVED_ACCESSORY_CONTAINER" = false
                    case "$ARCH" in
                      x64)
                        test "$EXPECTED_SHA" = 64eaabf230b543d0f4fbc6d47f9a3fa1f53e1ed0683933dc00f9b4b7b26fdc4b
                        manifest_sha=1de28376bd03ff2e77dd152ff99b116c79b8be47268a0cf09b9f503c828e5668 ;;
                      arm64)
                        test "$EXPECTED_SHA" = 912ca67da780976478213c63f709b4499eabb590d17f32c5c2603368d8617664
                        manifest_sha=1e92a7767ee7c00e91d198c45622b99e6744240ffa5182992ffa7773754f48d0 ;;
                    esac
                  fi
                  gh api "repos/CyberfiTechh/CyberFi-Releases/releases/$RELEASE_ID" > "$RUNNER_TEMP/release.json"
                  jq -e --argjson id "$ASSET_ID" --arg sha "sha256:$EXPECTED_SHA" --arg name "$filename" --arg tag "macos-v$TARGET_VERSION" \
                    '.tag_name == $tag and any(.assets[]; .id == $id and .digest == $sha and .name == $name)' "$RUNNER_TEMP/release.json"
                  if [ "$TARGET_VERSION" = 0.0.128 ]; then
                    manifest_id="$(jq -er --arg name "$filename.update.json" --arg digest "sha256:$manifest_sha" \
                      --arg source "Kaynak: https://github.com/CyberfiTechh/CyberFi/commit/a90b7531455ad651cd0b2667cf40a4d37aaf84e3" \
                      'select(.draft == false and (.body | contains($source))) |
                       [.assets[] | select(.name == $name and .state == "uploaded" and .digest == $digest and .size <= 4096)] |
                       select(length == 1) | .[0].id' "$RUNNER_TEMP/release.json")"
                    [[ "$manifest_id" =~ ^[0-9]+$ ]]
                    gh api -H 'Accept: application/octet-stream' "repos/CyberfiTechh/CyberFi-Releases/releases/assets/$manifest_id" > "$RUNNER_TEMP/candidate.update.json"
                    printf '%s  %s\n' "$manifest_sha" "$RUNNER_TEMP/candidate.update.json" | shasum -a 256 -c -
                  fi
                  gh api -H 'Accept: application/octet-stream' "repos/CyberfiTechh/CyberFi-Releases/releases/assets/$ASSET_ID" > "$RUNNER_TEMP/candidate.dmg"
                  printf '%s  %s\n' "$EXPECTED_SHA" "$RUNNER_TEMP/candidate.dmg" | shasum -a 256 -c -
                  if [ "$TARGET_VERSION" = 0.0.128 ]; then
                    node --input-type=module - "$RUNNER_TEMP/candidate.dmg" "$RUNNER_TEMP/candidate.update.json" "$TARGET_VERSION" "$filename" "$EXPECTED_SHA" <<'NODE'
                  import assert from "node:assert/strict";
                  import { readFileSync, statSync } from "node:fs";
                  import { verify } from "node:crypto";
                  const PUBLIC_KEY = "-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA09ZxJMbpq1uFEnz7n52M\nAJtceCXVQCo57lgwMAmizgJaGVGsgsMpzqgCCRgXBN+bPygE+16S9XwYOwHDlnNG\noq8h+bE9Nxce3PzsQHrscdHTT1lGQ/5XwSmvzTvxLdURtQWpaXZl7lJghUnZHNDA\n8SOHbk8rQ+butE82lhcq0C+hgJgHTUqFl9Irppi2O+MpufsZo8PX5jphD4H0aX0k\nB9P+LUreoBmG/L3T3AMZEzQZG606awc/ZMYsJcJkt4xNMjR3ZMz1aWKErW2AXDeY\nyfAo0zmEAUEAFSc3UEJRnmBAjorVA3C/rHJzYP7QabSh8ORLOUrqQYgqCpTLETpf\nct0J+NphCLuBGNQ5IeId5IPiBNZlKynGzP/HK+oJTvJ31hTHIiaA+5pfIESXELIZ\nJ5awYGW0y7fii0CqRGwFMJnU829APVvAC9LJUzSSz7NP+2rmc/boYInx8cjN2/LO\nLI9HsPvON+oxM4MhjRxDd4CVoKDpI+rB2TthSdfxt3UxAgMBAAE=\n-----END PUBLIC KEY-----";
                  const [installer, manifest, version, filename, sha] = process.argv.slice(2);
                  const value = JSON.parse(readFileSync(manifest, "utf8").replace(/^\uFEFF/u, ""));
                  const size = statSync(installer).size;
                  assert(value.sha256 === sha && value.size === size);
                  const payload = Buffer.from([version, filename, sha, size, ""].join("\n"));
                  assert(verify("sha256", payload, PUBLIC_KEY, Buffer.from(value.signature, "base64")));
                  NODE
                  fi
                  hdiutil verify "$RUNNER_TEMP/candidate.dmg"
                  mkdir "$RUNNER_TEMP/CyberFi-MCP-DMG"
                  hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/CyberFi-MCP-DMG" "$RUNNER_TEMP/candidate.dmg"
                  app="$RUNNER_TEMP/CyberFi-MCP-DMG/CyberFi.app"
                  test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$TARGET_VERSION"
                  lipo "$app/Contents/MacOS/CyberFi" -verify_arch "$native"
                  if [ "$ARCH" = arm64 ]; then codesign --verify --deep --strict "$app"; fi
            - name: Run production dependency preparation and nine real MCP calls
              working-directory: upstream
              run: |
                  set -euo pipefail
                  unset GH_TOKEN GITHUB_TOKEN NODE_OPTIONS ELECTRON_RUN_AS_NODE
                  node --import tsx "$GITHUB_WORKSPACE/acceptance/scripts/verify-macos-mcp.mjs" \
                    "$PWD" "$RUNNER_TEMP/CyberFi-MCP-DMG/CyberFi.app/Contents/MacOS/CyberFi"
            - name: Detach owned DMG
              if: always()
              run: hdiutil detach "$RUNNER_TEMP/CyberFi-MCP-DMG" || true
            - name: Collect bounded fixed-equation diagnostics after a failure
              if: failure()
              run: node "$GITHUB_WORKSPACE/acceptance/scripts/diagnose-math-worker.mjs" "$HOME/CyberFi-mcp-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              if: always()
              with:
                  name: CyberFi-macOS-MCP-${{ inputs.architecture }}-${{ inputs.asset_id }}
                  path: |
                      ~/CyberFi-mcp-${{ github.run_id }}-${{ github.run_attempt }}/mcp-acceptance.json
                      ~/CyberFi-mcp-${{ github.run_id }}-${{ github.run_attempt }}/normal-caller-precondition.json
                      ~/CyberFi-mcp-${{ github.run_id }}-${{ github.run_attempt }}/derived-container.json
                      ~/CyberFi-mcp-${{ github.run_id }}-${{ github.run_attempt }}/math-worker-diagnostic.json
                      ~/CyberFi-mcp-${{ github.run_id }}-${{ github.run_attempt }}/home/.pdr-kocum-agent/mcp-runtime/setup-report.json
                      ~/CyberFi-mcp-${{ github.run_id }}-${{ github.run_attempt }}/home/.pdr-kocum-agent/mcp-runtime/*.setup.log
                      ~/CyberFi-mcp-${{ github.run_id }}-${{ github.run_attempt }}/triangle.html
                      ~/CyberFi-mcp-${{ github.run_id }}-${{ github.run_attempt }}/triangle.preview.png
                      ~/CyberFi-mcp-${{ github.run_id }}-${{ github.run_attempt }}/home/.pdr-kocum-agent/mcp-runtime/sources-*/assets/mcp/charts/outputs/*.png
                  include-hidden-files: true
                  retention-days: 7
