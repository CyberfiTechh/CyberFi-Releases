name: Verify released CyberFi Windows 115 install and upgrade
run-name: Verify Windows 0.0.114 to 0.0.115

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    installed:
        if: github.repository == 'CyberfiTechh/CyberFi-Releases' && github.event.repository.private == false && github.ref == 'refs/heads/main'
        runs-on: windows-2025
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  path: acceptance
                  persist-credentials: false
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  repository: slopus/happy-desktop
                  ref: c9feffb54cdb3591220dafced4070e118e3d297a
                  path: upstream
                  persist-credentials: false
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
              with:
                  package_json_file: upstream/package.json
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
              with:
                  node-version: "24"
                  package-manager-cache: false
            - name: Install the public upstream hidden launcher
              working-directory: upstream
              run: pnpm install --frozen-lockfile --ignore-scripts
            - name: Self-check the acceptance harness
              shell: pwsh
              run: ./acceptance/scripts/verify-windows.ps1 -SelfCheck
            - name: Install released 113 and upgrade to released 114
              shell: pwsh
              run: ./acceptance/scripts/verify-windows.ps1 -Upgrade115 -UpstreamPath "$env:GITHUB_WORKSPACE/upstream"
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              if: always()
              with:
                  name: CyberFi-Windows-114-to-115
                  path: ${{ runner.temp }}/cyberfi-windows-upgrade-115/evidence
                  retention-days: 7
