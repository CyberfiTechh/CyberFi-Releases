name: Verify released CyberFi macOS install and upgrade
run-name: Verify Intel macOS 0.0.113 to 0.0.114

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    installed:
        if: github.repository == 'CyberfiTechh/CyberFi-Releases' && github.event.repository.private == false && github.ref == 'refs/heads/main'
        runs-on: macos-15-intel
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  path: acceptance
                  persist-credentials: false
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  repository: slopus/happy-desktop
                  ref: c9feffb54cdb3591220dafced4070e118e3d297a
                  path: upstream
                  persist-credentials: false
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
              with:
                  package_json_file: upstream/package.json
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
              with:
                  node-version: "24"
                  package-manager-cache: false
            - name: Install the public upstream hidden launcher
              working-directory: upstream
              run: pnpm install --frozen-lockfile --ignore-scripts
            - name: Download immutable published DMGs
              shell: bash
              run: |
                  set -euo pipefail
                  test "$(uname -m)" = x86_64
                  downloads="$RUNNER_TEMP/cyberfi-install-downloads"
                  mkdir "$downloads"
                  root="$HOME/CyberFi-install-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
                  test ! -e "$root"
                  echo "ACCEPTANCE_ROOT=$root" >> "$GITHUB_ENV"
                  echo "DMG_ROOT=$downloads" >> "$GITHUB_ENV"
                  for version in 0.0.113 0.0.114; do
                    tag="v$version"
                    if [ "$version" = 0.0.114 ]; then tag="macos-v$version"; fi
                    echo "Downloading released Intel $version"
                    curl --fail --location --retry 2 --connect-timeout 20 --max-time 300 \
                      "https://github.com/CyberfiTechh/CyberFi-Releases/releases/download/$tag/CyberFi-$version-x64.dmg" \
                      --output "$downloads/CyberFi-$version-x64.dmg"
                  done
                  # The acceptance script checks the independently pinned SHA256 values
                  # before mounting either archive; release tags cannot replace those pins.
            - name: Install 113 and manually upgrade the same app to 114
              shell: bash
              working-directory: upstream
              run: |
                  set -euo pipefail
                  unset GH_TOKEN GITHUB_TOKEN NODE_OPTIONS ELECTRON_RUN_AS_NODE
                  node --check "$GITHUB_WORKSPACE/acceptance/scripts/verify-macos-install.mjs"
                  node --import tsx "$GITHUB_WORKSPACE/acceptance/scripts/verify-macos-install.mjs" \
                    "$PWD" "$ACCEPTANCE_ROOT" \
                    "$DMG_ROOT/CyberFi-0.0.113-x64.dmg" "$DMG_ROOT/CyberFi-0.0.114-x64.dmg"
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              if: always()
              with:
                  name: CyberFi-macOS-Intel-113-to-114
                  path: |
                      ${{ env.ACCEPTANCE_ROOT }}/install-upgrade-report.json
                      ${{ env.ACCEPTANCE_ROOT }}/smoke-*.json
                      ${{ env.ACCEPTANCE_ROOT }}/welcome-*.png
                  retention-days: 7
