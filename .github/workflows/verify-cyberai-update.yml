name: Verify CyberAI fresh Windows engine onboarding
run-name: CyberAI 131 signed draft clean profile engine setup ${{ inputs.target }}
on:
    workflow_dispatch:
        inputs:
            target:
                type: choice
                options: [windows]
                required: true
permissions:
    contents: read
jobs:
    native:
        if: github.repository == 'CyberfiTechh/CyberFi-Releases' && github.event.repository.private == false && github.ref == 'refs/heads/codex/windows-fresh-engine-131' && inputs.target == 'windows'
        permissions:
            contents: write # Required by GitHub to download the exact signed draft assets.
        runs-on: windows-2025
        timeout-minutes: 35
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  path: acceptance
                  persist-credentials: false
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  repository: slopus/happy-desktop
                  ref: c9feffb54cdb3591220dafced4070e118e3d297a
                  path: upstream
                  persist-credentials: false
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
              with:
                  version: 10.28.1
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
              with:
                  node-version: "24"
                  package-manager-cache: false
            - name: Install existing hidden launcher and recording dependencies
              working-directory: upstream
              shell: bash
              env:
                  PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/cyberfi-update-playwright
              run: |
                  pnpm install --frozen-lockfile --ignore-scripts
                  pnpm --dir packages/happy-desktop-gym exec playwright install ffmpeg
                  echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
            - name: Select the shared Windows recording executable
              if: inputs.target == 'windows'
              shell: pwsh
              run: |
                  $cache = Get-Item -LiteralPath $env:PLAYWRIGHT_BROWSERS_PATH
                  $expected = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP 'cyberfi-update-playwright'))
                  if ($cache.FullName -ne $expected -or ($cache.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'Invalid owned ffmpeg cache' }
                  $ffmpeg = @(Get-ChildItem -LiteralPath $cache.FullName -Directory -Filter 'ffmpeg-*' |
                      Where-Object { -not ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) } |
                      ForEach-Object { Get-Item -LiteralPath (Join-Path $_.FullName 'ffmpeg-win64.exe') -ErrorAction SilentlyContinue })
                  if ($ffmpeg.Count -ne 1 -or $ffmpeg[0].PSIsContainer -or ($ffmpeg[0].Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'Exactly one owned ffmpeg executable is required' }
                  "HAPPY_DESKTOP_GYM_FFMPEG=$($ffmpeg[0].FullName)" >> $env:GITHUB_ENV
            - name: Verify fresh Windows GUI downloads and starts the stable engine
              working-directory: upstream
              shell: bash
              env:
                  TARGET: ${{ inputs.target }}
                  ARCH: x64
                  ACCEPTANCE_SOURCE_SHA: d070120ddfdfa8b769e3fcc0b6cacee704306598
                  GH_TOKEN: ${{ github.token }}
                  CYBERAI_USERNAME: ${{ secrets.CYBERAI_CI125_WINDOWS_USERNAME }}
                  CYBERAI_PASSWORD: ${{ secrets.CYBERAI_CI125_WINDOWS_PASSWORD }}
              run: |
                  powershell.exe -NoLogo -NoProfile -NonInteractive -File "$GITHUB_WORKSPACE/acceptance/scripts/windows-owned-launch.ps1" -RunUpdate
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              if: always()
              with:
                  name: CyberAI-windows-fresh-engine
                  path: |
                      ${{ runner.temp }}/cyberfi-windows-owned-evidence
                  retention-days: 7
                  include-hidden-files: false
