name: Verify CyberAI published native automatic update
run-name: CyberFi127 Windows launcher token selftest
on: workflow_dispatch
permissions:
  contents: read
jobs:
  token:
    if: github.repository == 'CyberfiTechh/CyberFi-Releases' && github.ref == 'refs/heads/codex/windows-launch127-preflight'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify same-user non-elevated token and environment without GUI
        shell: pwsh
        run: |
          & ./scripts/windows-owned-launch.ps1 -SelfTest | Tee-Object -FilePath "$env:RUNNER_TEMP/owned-launch-selftest.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native token preflight failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: CyberFi127-Windows-owned-launch-preflight
          path: ${{ runner.temp }}/owned-launch-selftest.json
          retention-days: 7
