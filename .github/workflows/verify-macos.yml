name: Verify unpublished CyberFi 138 bridge and139 ARM candidate
run-name: CyberFi 139 ARM candidate asset ${{ inputs.asset_id }}
on:
  workflow_dispatch:
    inputs:
      architecture:
        type: choice
        options: [arm64]
        required: true
      release_id:
        type: string
        required: true
      asset_id:
        type: string
        required: true
      bridge_asset_id:
        type: string
        required: true
      bridge_sha256:
        type: string
        required: true
      sha256:
        type: string
        required: true
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'CyberfiTechh/CyberFi-Releases' && github.event.repository.private == false && startsWith(github.ref, 'refs/heads/codex/139-arm-acceptance-')
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: acceptance
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: slopus/happy-desktop
          ref: c9feffb54cdb3591220dafced4070e118e3d297a
          path: upstream
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.28.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install the pinned hidden launcher and recorder
        working-directory: upstream
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir packages/happy-desktop-gym exec playwright install ffmpeg
      - name: Verify the exact private draft and native ARM package
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          ASSET_ID: ${{ inputs.asset_id }}
          EXPECTED_SHA: ${{ inputs.sha256 }}
          BRIDGE_ASSET_ID: ${{ inputs.bridge_asset_id }}
          BRIDGE_SHA: ${{ inputs.bridge_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          [[ "$RELEASE_ID" =~ ^[0-9]+$ && "$ASSET_ID" =~ ^[0-9]+$ && "$EXPECTED_SHA" =~ ^[0-9a-f]{64}$ ]]
          gh api "repos/CyberfiTechh/CyberFi-Releases/releases/$RELEASE_ID" > "$RUNNER_TEMP/release.json"
          jq -e --argjson id "$ASSET_ID" --arg digest "sha256:$EXPECTED_SHA" '.draft == true and .tag_name == "mac-v0.0.139" and any(.assets[]; .id == $id and .digest == $digest and .name == "CyberFi-0.0.139-arm64.dmg")' "$RUNNER_TEMP/release.json" > /dev/null
          gh api -H 'Accept: application/octet-stream' "repos/CyberfiTechh/CyberFi-Releases/releases/assets/$ASSET_ID" > "$RUNNER_TEMP/candidate.dmg"
          printf '%s  %s\n' "$EXPECTED_SHA" "$RUNNER_TEMP/candidate.dmg" | shasum -a 256 -c -
          hdiutil verify "$RUNNER_TEMP/candidate.dmg"
          mkdir "$RUNNER_TEMP/CyberFi-DMG"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/CyberFi-DMG" "$RUNNER_TEMP/candidate.dmg"
          app="$RUNNER_TEMP/CyberFi-DMG/CyberFi.app"
          lipo "$app/Contents/MacOS/CyberFi" -verify_arch arm64
          codesign --verify --deep --strict "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")" = 0.0.139
          echo "CYBERFI_TEST_APP=$app/Contents/MacOS/CyberFi" >> "$GITHUB_ENV"
          [[ "$BRIDGE_ASSET_ID" =~ ^[0-9]+$ && "$BRIDGE_SHA" =~ ^[0-9a-f]{64}$ ]]
          gh api -H 'Accept: application/octet-stream' "repos/CyberfiTechh/CyberFi-Releases/releases/assets/$BRIDGE_ASSET_ID" > "$RUNNER_TEMP/bridge.dmg"
          printf '%s  %s\n' "$BRIDGE_SHA" "$RUNNER_TEMP/bridge.dmg" | shasum -a 256 -c -
          hdiutil verify "$RUNNER_TEMP/bridge.dmg"
          mkdir "$RUNNER_TEMP/Bridge-DMG"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/Bridge-DMG" "$RUNNER_TEMP/bridge.dmg"
          bridge="$RUNNER_TEMP/Bridge-DMG/CyberFi.app"
          lipo "$bridge/Contents/MacOS/CyberFi" -verify_arch arm64
          codesign --verify --deep --strict "$bridge"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$bridge/Contents/Info.plist")" = 0.0.138
          echo "CYBERFI_TEST_BRIDGE_APP=$bridge" >> "$GITHUB_ENV"
          echo "CYBERFI_TARGET_DMG=$RUNNER_TEMP/candidate.dmg" >> "$GITHUB_ENV"

      - name: Run real hidden ARM app and record login and access boundary
        working-directory: upstream
        run: |
          unset GH_TOKEN GITHUB_TOKEN
          node --import tsx "$GITHUB_WORKSPACE/acceptance/scripts/verify-cyberfi-139-arm.mjs" "$PWD"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: CyberFi-139-ARM-${{ inputs.asset_id }}
          path: |
            ${{ runner.temp }}/cyberfi-arm139/report.json
            ${{ runner.temp }}/cyberfi-arm139/checkpoint.json
            ${{ runner.temp }}/cyberfi-arm139/login.png
            ${{ runner.temp }}/cyberfi-arm139/login.webm
          retention-days: 1
          include-hidden-files: false
      - name: Detach the owned image
        if: always()
        run: |
          hdiutil detach "$RUNNER_TEMP/Bridge-DMG" || true
          hdiutil detach "$RUNNER_TEMP/CyberFi-DMG" || true
