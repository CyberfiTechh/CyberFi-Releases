name: Verify reviewed CyberFi 142 native ARM draft
on:
  workflow_dispatch:
    inputs:
      release_id: {type: string, required: true}
      package_id: {type: string, required: true}
      package_sha256: {type: string, required: true}
      signature_id: {type: string, required: true}
      signature_sha256: {type: string, required: true}
      manifest_id: {type: string, required: true}
      manifest_sha256: {type: string, required: true}
permissions:
  contents: read
jobs:
  native-arm142:
    if: github.repository == 'CyberfiTechh/CyberFi-Releases' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Fetch only exact reviewed private draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ inputs.release_id }}
          PID: ${{ inputs.package_id }}
          PSHA: ${{ inputs.package_sha256 }}
          SID: ${{ inputs.signature_id }}
          SSHA: ${{ inputs.signature_sha256 }}
          MID: ${{ inputs.manifest_id }}
          MSHA: ${{ inputs.manifest_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          [[ "$RID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/CyberfiTechh/CyberFi-Releases/releases/$RID" > "$RUNNER_TEMP/release.json"
          jq -e '.draft==false and .prerelease==true and .tag_name=="mac-v0.0.142"' "$RUNNER_TEMP/release.json" >/dev/null
          for spec in "$PID:$PSHA:CyberFi-0.0.142-arm64.dmg:536870912" "$SID:$SSHA:CyberFi-0.0.142-arm64.dmg.update.json:4096" "$MID:$MSHA:CyberFi-0.0.142-arm64.acceptance.json:1048576"; do
            IFS=: read -r id digest name bound <<< "$spec"
            [[ "$id" =~ ^[1-9][0-9]*$ && "$digest" =~ ^[a-f0-9]{64}$ ]]
            jq -e --argjson id "$id" --arg name "$name" --arg digest "sha256:$digest" --argjson bound "$bound" 'any(.assets[];.id==$id and .name==$name and .digest==$digest and .size>0 and .size<=$bound)' "$RUNNER_TEMP/release.json" >/dev/null
            gh api -H 'Accept: application/octet-stream' "repos/CyberfiTechh/CyberFi-Releases/releases/assets/$id" > "$RUNNER_TEMP/$name"
            printf '%s  %s\n' "$digest" "$RUNNER_TEMP/$name" | shasum -a 256 -c -
          done
      - name: Prepare pinned observation tools
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/tools" --ignore-scripts --no-audit --no-fund @electron/asar@3.4.1 playwright@1.61.1
          node "$RUNNER_TEMP/tools/node_modules/playwright/cli.js" install ffmpeg
      - name: Verify production RSA, full payload and real hidden ARM startup
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          node scripts/arm142-final/verify.mjs "$RUNNER_TEMP/CyberFi-0.0.142-arm64.dmg" "$RUNNER_TEMP/CyberFi-0.0.142-arm64.dmg.update.json" "$RUNNER_TEMP/CyberFi-0.0.142-arm64.acceptance.json" "$RUNNER_TEMP/tools"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: CyberFi-142-final-native-ARM-verification
          path: |
            ${{ runner.temp }}/cyberfi-arm142-*/report.json
            ${{ runner.temp }}/cyberfi-arm142-*/login.png
            ${{ runner.temp }}/cyberfi-arm142-*/login.webm
          retention-days: 1
