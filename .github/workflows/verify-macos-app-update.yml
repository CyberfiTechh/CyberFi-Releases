name: Verify real CyberFi macOS automatic update
run-name: Mac automatic update 123 to 124 ${{ inputs.architecture }}
on:
    workflow_dispatch:
        inputs:
            architecture:
                type: choice
                options: [x64, arm64]
                required: true
            artifacts_json:
                type: string
                description: Reviewed source123 and target124 release/asset/manifest IDs and SHA256 pins
                required: true
permissions:
    contents: read
jobs:
    native:
        if: github.repository == 'CyberfiTechh/CyberFi-Releases' && github.event.repository.private == false && github.ref == 'refs/heads/main'
        permissions:
            contents: write # GitHub requires this to read the exact unpublished bootstrap fixture.
        runs-on: ${{ inputs.architecture == 'arm64' && 'macos-15' || 'macos-15-intel' }}
        timeout-minutes: 35
        env:
            ARCH: ${{ inputs.architecture }}
            ACCEPTANCE_ARTIFACTS: ${{ inputs.artifacts_json }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  path: acceptance
                  persist-credentials: false
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  repository: slopus/happy-desktop
                  ref: c9feffb54cdb3591220dafced4070e118e3d297a
                  path: upstream
                  persist-credentials: false
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
              with:
                  version: 10.28.1
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
              with:
                  node-version: "24"
                  package-manager-cache: false
            - name: Install existing hidden gym and video dependencies
              working-directory: upstream
              run: |
                  pnpm install --frozen-lockfile --ignore-scripts
                  pnpm --dir packages/happy-desktop-gym exec playwright install ffmpeg
            - name: Verify immutable inputs, actual GUI download and native handoff
              working-directory: upstream
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node --import tsx "$GITHUB_WORKSPACE/acceptance/scripts/verify-macos-app-update.mjs" "$GITHUB_WORKSPACE/upstream"
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              if: always()
              with:
                  name: CyberFi-Mac-auto-update-${{ inputs.architecture }}-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/cyberfi-macos-app-update/evidence
                  include-hidden-files: false
                  retention-days: 7
